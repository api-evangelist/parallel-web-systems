scope: per-account (API key)
counting_rule: >-
  Rate limits apply only to POST requests that CREATE new resources. GET requests that
  retrieve results or poll status do not count against the quota - e.g. polling
  GET /v1/tasks/runs/{run_id} does not consume the Tasks limit.
limit_count: 7
limits:
- product: Search
  operation: POST /v1/search
  limit: 600
  window: 1m
  scope: per-account
- product: Extract
  operation: POST /v1/extract
  limit: 600
  window: 1m
  scope: per-account
- product: Tasks / TaskGroups
  operation: POST /v1/tasks/runs or POST /v1/tasks/groups/{taskgroup_id}/runs
  limit: 2000
  window: 1m
  scope: per-account
- product: Chat
  operation: POST /v1beta/chat/completions
  limit: 300
  window: 1m
  scope: per-account
- product: FindAll
  operation: POST /v1beta/findall/runs
  limit: 300
  window: 1h
  scope: per-account
  note: >-
    The docs rate-limit table states 300 per hour for creating a FindAll generator; the
    marketing pricing page shows 25/hr for Find All. Both are published by Parallel and
    they disagree - recorded as found, not reconciled.
- product: Entity Search
  operation: POST /v1beta/findall/entity-search
  limit: 600
  window: 1m
  scope: per-account
- product: Monitor
  operation: POST /v1alpha/monitors
  limit: 300
  window: 1m
