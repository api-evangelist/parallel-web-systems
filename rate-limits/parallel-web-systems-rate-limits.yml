  source: https://parallel.ai/pricing
  note: Published on the pricing page; not yet listed in the docs rate-limit table.
response_headers:
  published: false
  observed: []
  detail: >-
    Parallel documents no RateLimit-* / X-RateLimit-* response headers and the OpenAPI
    declares none, so an agent cannot read remaining quota from a response. This is the
    material gap - the numbers are published but the runtime signal is not.
exhaustion:
  status_code: 429
  retry_after: undocumented
  note: >-
    A 429 rate-limit status is the conventional exhaustion code and appears in the API
    error reference; no Retry-After semantics are documented.
increases:
  process: Contact support@parallel.ai with use case and requirements.
  contact: support@parallel.ai
free_tier:
  detail: >-
    The hosted Search MCP (https://search.parallel.ai/mcp) is free anonymously at
    "lower rate limits" - the anonymous ceiling is not numerically published. Passing a
    Parallel API key as a Bearer token raises it. Free-tier requests are correlated by
    the `session_id` argument the MCP tools require.
notes: >-
  Limits read verbatim from the published rate-limit reference and cross-checked against
  the pricing page. See conventions/parallel-web-systems-conventions.yml for the wider
  runtime semantics and errors/parallel-web-systems-problem-types.yml for the error envelope.
