  from a live tools/list response; the REST operations are exactly the operationIds in the
  captured OpenAPI. The headline finding is the asymmetry - Parallel ships 36 REST
  operations but only 2 of them are reachable as MCP tools, so an MCP-only agent gets
  search and fetch while deep research, FindAll, Monitor, Responses and Memory remain
  REST-only (deep research partially reachable via A2A).
