- tool: web_search
  category: search
  rest:
  - v1_search_v1_search_post
  binding: POST /v1/search
  confidence: high
  tool_inputs:
    required:
    - objective
    - search_queries
    optional:
    - session_id
    - model_name
  note: >-
    Parallel's own MCP documentation states the tools "invoke the Search API and Extract
    API endpoints but present a simpler interface". The tool inherits the /v1/search
    objective + search_queries contract; the MCP wrapper pins mode to `basic` and caps
    total excerpts per call at roughly 25,000 characters, so it is a constrained subset of
    the REST operation, not a 1:1 passthrough. session_id and model_name are MCP-only
    arguments used for free-tier rate limiting and analytics - they have no REST
    equivalent.
