    excerpts intended to answer directly; supports multiple search_queries per call.
- name: web_fetch
  description: >-
    Pulls token-efficient markdown from specific URLs. Use after web_search narrows
    down candidates, or when the agent already has a URL it needs to read in depth.
    Accepts multiple related URLs plus a common objective per call.
