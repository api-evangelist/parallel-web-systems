  task_mcp_note: >-
    A task-mcp repo exists under the GitHub org but no hosted endpoint or published
    package for it was found; it is not counted as a deployed server here.
notes: >-
  Upgraded from a bare initialize handshake to a full live tools/list - both tools were
  returned anonymously with complete inputSchema AND outputSchema, so the tool contract in
