generated: '2026-08-14'
method: derived
source: >-
  openapi/_original/parallel-web-systems-openapi.json + https://docs.parallel.ai +
  https://docs.parallel.ai/getting-started/rate-limits
auth:
  style: api-key
  scheme: apiKey
  location: header
  parameter: x-api-key
  key_issuance: >-
    Keys are minted at platform.parallel.ai; the parallel-cli obtains them via an
    OAuth 2.0 device-code flow (RFC 8414 metadata at platform.parallel.ai/.well-known/oauth-authorization-server).
  see: authentication/parallel-web-systems-authentication.yml
versioning:
  style: uri-path
  stable_prefix: /v1
  beta_prefix: /v1beta
  beta_header: parallel-beta
  detail: >-
    Stable operations live under /v1 (Search, Extract, Tasks, Monitor). Newer or
    experimental surfaces (FindAll, Chat Completions, legacy task events) live under
    /v1beta and are opted into via the `parallel-beta` request header.
idempotency:
  supported: false
  detail: The OpenAPI declares no idempotency key header; task/monitor creation is not idempotent by key.
pagination:
  style: cursor
  detail: >-
    Long-running collection and event endpoints (task-group runs, monitor events,
    FindAll/monitor event streams) page via cursor/last_event_id parameters rather
    than numeric offsets.
  params:
  - last_event_id
async:
  style: poll-or-webhook-or-sse
  detail: >-
    Tasks, FindAll runs, and Monitors are asynchronous - create returns a run/monitor id,
    then poll the status/result endpoints, stream Server-Sent Events from the /events
    endpoints, or subscribe to webhooks.
  see: asyncapi/parallel-web-systems-webhooks.yml
error_envelope:
  format: custom-json
  detail: >-
    Non-2xx responses return {"type":"error","error":{"ref_id","message","detail"}}.
    This is NOT RFC 9457 problem+json; content-type is application/json.
  reference_id_field: error.ref_id
  see: errors/parallel-web-systems-problem-types.yml
rate_limiting:
  scope: per-account (API key)
  counting_rule: >-
    Only resource-CREATING POSTs count. GET polling of status/results is not metered against
    the limit.
  published_limits:
  - Search 600/min
  - Extract 600/min
  - Tasks/TaskGroups 2,000/min
  - Chat 300/min
  - Responses 300/min
  - FindAll 300/hr
  - Entity Search 600/min
  - Monitor 300/min
  response_headers: none
  exhaustion_status: 429
  detail: >-
    Limits are numerically published but there are NO RateLimit-* / X-RateLimit-* response
    headers, so an agent cannot read remaining quota at runtime - it can only fail into a 429.
    Free-tier MCP usage is correlated by the `session_id` tool argument rather than a key.
  see: rate-limits/parallel-web-systems-rate-limits.yml
request_tracing:
  field: error.ref_id
  detail: Errors carry a ref_id for support correlation.
  mcp_session: >-
    The hosted MCP tools require a caller-generated `session_id` (UUID or 32+ char hex) reused
    across every call in a conversation, used for free-tier rate limiting and log correlation.
pricing:
  model: pay-as-you-go, metered per request/run
  see: plans/parallel-web-systems-plans-pricing.yml
agent_surfaces:
  mcp: mcp/parallel-web-systems-mcp.yml
  a2a: a2a/parallel-web-systems-a2a.yml
  crosswalk: mcp/parallel-web-systems-tool-crosswalk.yml
  skills: skills/_index.yml
notes: >-
  Cross-cutting semantics derived from the OpenAPI 3.1 spec (v0.1.2) and the public docs.
