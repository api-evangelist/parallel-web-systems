aid: parallel-web-systems
name: Parallel Web Systems
description: >-
  Parallel Web Systems builds infrastructure for intelligence on the web, giving AI agents
  and developers high-quality, low-latency access to the internet. Its API suite spans a
  Search API (high-accuracy, cross-referenced web search with turbo/basic/advanced modes),
  an Extract API for token-efficient page content, a Task / Deep Research API for multi-hop
  research, an OpenAI-compatible Responses API for cited answers in seconds, FindAll and
  Entity Search for entity discovery, a Monitor API for continuous web change tracking, a
  beta Memory API for reusable research context, and a Chat Completions (beta) surface.
  Parallel is unusually complete on the agent surface: a free hosted Search MCP server whose
  tools/list answers anonymously, an A2A Deep Research agent advertised by a conformant
  agent card at api.parallel.ai, published Agent Skills served from /.well-known/, an
  llms.txt, and an OAuth key-issuance provider with RFC 8414 metadata. It ships first-party
  Python and TypeScript SDKs plus a parallel-cli, prices everything pay-as-you-go with a
  free monthly allowance, is SOC 2 Type II certified, and is backed by Index Ventures.
