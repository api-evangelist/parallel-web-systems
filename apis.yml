- aid: parallel-web-systems:parallel-web-systems-responses-api
  name: Parallel Web Systems Responses API
  description: >-
    The Responses API is an OpenAI Responses-compatible endpoint that returns fully cited answers
    grounded in the live web, with structured output support and 5-60 second response times. Cost and
    latency are selected via a `reasoning.effort` tier (low, medium, high). It is the synchronous,
    latency-sensitive counterpart to the asynchronous Task API, intended for research subagents and
    in-product answers.
  humanURL: https://docs.parallel.ai/responses-api/responses-quickstart
  baseURL: https://api.parallel.ai
