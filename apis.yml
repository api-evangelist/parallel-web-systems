  description: >-
    Search returns ranked URLs with extended excerpts suitable for LLM consumption. Inputs are a natural-language
    objective and optional keyword queries. Source policies allow including or excluding specific domains
    and have configurable output sizes. The returned extended snippets contain dense, relevant information
