- aid: parallel-web-systems:parallel-web-systems-tasks-api
  name: Parallel Web Systems Tasks API
  description: >-
    The Task API executes web research and extraction tasks. Clients submit a natural-language objective
    with an optional input schema; the service plans retrieval, fetches relevant URLs, and returns outputs
    that conform to a provided or inferred JSON schema. Supports deep research style queries and can return
    rich structured JSON outputs. Processors trade-off between cost, latency, and quality. Each processor
    supports calibrated confidences.

    - Output metadata: citations, excerpts, reasoning, and confidence per field


    Task Groups enable batch execution of many independent Task runs with group-level monitoring and failure
    handling.

    - Submit hundreds or thousands of Tasks as a single group

    - Observe group progress and receive results as they complete

    - Real-time updates via Server-Sent Events (SSE)

    - Add tasks to an existing group while it is running

    - Group-level retry and error aggregation
  humanURL: https://docs.parallel.ai/task-api/task-quickstart
  baseURL: https://api.parallel.ai
