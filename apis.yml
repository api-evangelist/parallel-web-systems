  name: Parallel Web Systems FindAll API
  description: >-
    The FindAll API discovers and evaluates entities that match complex criteria from natural language
    objectives. Submit a high-level goal and the service automatically generates structured match conditions,
    discovers relevant candidates, and evaluates each against the criteria. Returns comprehensive results
    with detailed reasoning, citations, and confidence scores for each match decision. Streaming events
    and webhooks are supported.
