- aid: parallel-web-systems:parallel-web-systems-memory-api-beta
  name: Parallel Web Systems Memory API (Beta)
  description: >-
    The beta Memory API gives agents a persistent retrieval layer over previously gathered web
    context. It exposes three operations - retrieve memory for a query, evict a specific source from
    memory, and clear memory entirely - so an agent can reuse research across turns without refetching
    the web. The surface lives under the /v1beta prefix and is opted into via the `parallel-beta`
    request header.
  humanURL: https://docs.parallel.ai
  baseURL: https://api.parallel.ai
